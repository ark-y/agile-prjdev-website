
stages:
  - test
  - build

variables:
  NVM_DIR: "$CI_PROJECT_DIR/.nvm"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"

default:
  before_script:
    - |
      export NVM_DIR="$CI_PROJECT_DIR/.nvm"
      export NPM_CONFIG_CACHE="$CI_PROJECT_DIR/.npm"

      # Create required directories
      mkdir -p "$NVM_DIR"
      mkdir -p "$NPM_CONFIG_CACHE"

      # Install nvm if necessary
      if [ ! -s "$NVM_DIR/nvm.sh" ]; then
        curl -fsSL https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.3/install.sh | bash
      fi

      # Load nvm
      . "$NVM_DIR/nvm.sh"

      # Install and activate Node.js 22
      nvm install 22
      nvm use 22

      # Display installed versions
      node --version
      npm --version

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/
    - .nvm/

unit_tests:
  stage: test
  script:
    - npm ci --prefer-offline
    - echo "Checking available configuration files"
    - ls -la *config*
    - npm test -- --environment jsdom

coverage:
  stage: test
  script:
    - npm ci --prefer-offline
    - npm run test:coverage -- --environment jsdom
  artifacts:
    when: always
    paths:
      - coverage/
    expire_in: 1 week

build:
  stage: build
  script:
    - npm ci --prefer-offline
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
