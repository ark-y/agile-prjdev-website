
stages:
  - test
  - build

variables:
  NVM_DIR: "$CI_PROJECT_DIR/.nvm"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"

default:
  before_script:
    - |
      export NVM_DIR="$CI_PROJECT_DIR/.nvm"
      export NPM_CONFIG_CACHE="$CI_PROJECT_DIR/.npm"

      if [ ! -s "$NVM_DIR/nvm.sh" ]; then
        curl -fsSL https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.3/install.sh | bash
      fi

      . "$NVM_DIR/nvm.sh"
      nvm install 22
      nvm use 22

      node --version
      npm --version

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/
    - .nvm/

unit_tests:
  stage: test
  script:
    - npm ci --prefer-offline
    - npm test

coverage:
  stage: test
  script:
    - npm ci --prefer-offline
    - npm run test:coverage
  artifacts:
    when: always
    paths:
      - coverage/
    expire_in: 1 week

build:
  stage: build
  script:
    - npm ci --prefer-offline
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
