<!-- ==================== TEMPORARY JS ==================== -->

<script>


    // keeping track of sprint numbers
    let sprintCount = 1;



    // ==================== PROJECT POPUP ====================


    function openProjectPopup() {

        document
            .getElementById("projectPopup")
            .style.display = "flex";

    }


    function closeProjectPopup() {

        document
            .getElementById("projectPopup")
            .style.display = "none";

    }



    // ==================== CREATE PROJECT ====================


function createProject() {

   // getting what the user typed
   const nameInput =
       document.getElementById("projectName");


   const projectName =
       nameInput.value.trim();


   // stopping if empty
   if (projectName === "") {

       alert("Please enter a project name.");

       return;

   }


   // making a new project card
   const newCard =
       document.createElement("button");


   newCard.className =
       "project-card";


   newCard.onclick =
       openSampleProject;


   // putting the project name inside
   const nameSpan =
       document.createElement("span");


   nameSpan.className =
       "project-name";


   nameSpan.textContent =
       projectName;


   newCard.appendChild(nameSpan);


   // adding it to the dashboard
   document
       .getElementById("projectsSection")
       .appendChild(newCard);


   // clearing the input and closing the popup
   nameInput.value = "";

   closeProjectPopup();

}


    // ==================== PROJECT NAVIGATION ====================


    function openSampleProject() {

        document
            .getElementById("devDashboard")
            .style.display = "none";


        document
            .getElementById("taskForm")
            .style.display = "none";


        document
            .getElementById("projectOverview")
            .style.display = "block";

    }


    function backToProjects() {

        document
            .getElementById("projectOverview")
            .style.display = "none";


        document
            .getElementById("taskForm")
            .style.display = "none";


        document
            .getElementById("devDashboard")
            .style.display = "block";

    }



    // ==================== SPRINT DATES ====================


    function formatSprintDate(date) {

        if (!date) {

            return "--/--";

        }


        const parts =
            date.split("-");


        const month =
            parts[1];


        const day =
            parts[2];


        return day + "/" + month;

    }



    function openSprintDates(button) {

        const sprintBox =
            button.closest(".sprint-box");


        const dateDisplay =
            sprintBox.querySelector(
                ".sprint-date-display"
            );


        const dateEditor =
            sprintBox.querySelector(
                ".sprint-date-editor"
            );


        dateDisplay.style.display =
            "none";


        dateEditor.style.display =
            "flex";

    }

    function checkSprintDeadline(sprintBox) {

        const endDateInput =
            sprintBox.querySelector(".sprint-end-date");
        
        if(!endDateInput){
            return;
        }

        const endDate =
            endDateInput.value;

        // If there is no end date, do nothing
        if (endDate === "") {
            return;
        }

        const today = new Date();
        today.setHours(0, 0, 0, 0);

        const sprintEndDate = new Date(endDate);
        sprintEndDate.setHours(0, 0, 0, 0);

        // If the sprint has ended
        if (sprintEndDate < today) {
            sprintBox.style.opacity = "0.7";
        } else {
            sprintBox.style.opacity = "1";

        }
    }

    function updateSprintDates(input) {

        const sprintBox =
            input.closest(".sprint-box");


        const startDateInput =
            sprintBox.querySelector(
                ".sprint-start-date"
            );


        const endDateInput =
            sprintBox.querySelector(
                ".sprint-end-date"
            );


        const startDate =
            startDateInput.value;


        const endDate =
            endDateInput.value;


        endDateInput.min =
            startDate;


        if (
            startDate &&
            endDate &&
            endDate < startDate
        ) {

            endDateInput.value =
                "";

        }

        checkSprintDeadline(sprintBox);

    }



    function closeSprintDates(button) {

        const sprintBox =
            button.closest(".sprint-box");


        const startDateInput =
            sprintBox.querySelector(
                ".sprint-start-date"
            );


        const endDateInput =
            sprintBox.querySelector(
                ".sprint-end-date"
            );


        const dateDisplay =
            sprintBox.querySelector(
                ".sprint-date-display"
            );


        const dateEditor =
            sprintBox.querySelector(
                ".sprint-date-editor"
            );


        const startDate =
            startDateInput.value;


        const endDate =
            endDateInput.value;


        dateDisplay.textContent =
            formatSprintDate(startDate)
            + " - "
            + formatSprintDate(endDate);


        dateEditor.style.display =
            "none";


        dateDisplay.style.display =
            "inline-block";

    }



    // ==================== DELETE SPRINT ====================


    function deleteSprint(button) {

        const sprintBox =
            button.closest(".sprint-box");


        const sprintNameInput =
            sprintBox.querySelector(
                ".sprint-name-input"
            );


        const sprintName =
            sprintNameInput.value;


        const confirmed =
            confirm(
                "Are you sure you want to delete "
                + sprintName
                + "?"
            );


        if (confirmed) {

            sprintBox.remove();

        }

    }



    // ==================== ADD SPRINT ====================


    function addSprint() {

        sprintCount++;


        // sprint container
        const newSprint =
            document.createElement("section");


        newSprint.className =
            "sprint-box";



        // delete button
        const deleteButton =
            document.createElement("button");


        deleteButton.type =
            "button";


        deleteButton.className =
            "delete-sprint-button";


        deleteButton.textContent =
            "×";


        deleteButton.setAttribute(
            "aria-label",
            "Delete sprint"
        );


        deleteButton.onclick =
            function () {

                deleteSprint(this);

            };



        // sprint name
        const sprintName =
            document.createElement("input");


        sprintName.className =
            "sprint-name-input";


        sprintName.type =
            "text";


        sprintName.value =
            "SPRINT " + sprintCount;



        // date area
        const sprintDates =
            document.createElement("section");


        sprintDates.className =
            "sprint-dates";



        // compact date
        const dateDisplay =
            document.createElement("button");


        dateDisplay.type =
            "button";


        dateDisplay.className =
            "sprint-date-display";


        dateDisplay.textContent =
            "--/-- - --/--";


        dateDisplay.onclick =
            function () {

                openSprintDates(this);

            };



        // date editor
        const dateEditor =
            document.createElement("section");


        dateEditor.className =
            "sprint-date-editor";


        dateEditor.style.display =
            "none";



        // start date
        const startDate =
            document.createElement("input");


        startDate.type =
            "date";


        startDate.className =
            "sprint-start-date";


        startDate.onchange =
            function () {

                updateSprintDates(this);

            };



        // dash
        const dash =
            document.createElement("span");


        dash.textContent =
            "-";



        // end date
        const endDate =
            document.createElement("input");


        endDate.type =
            "date";


        endDate.className =
            "sprint-end-date";


        endDate.onchange =
            function () {

                updateSprintDates(this);

            };



        // done button
        const doneButton =
            document.createElement("button");


        doneButton.type =
            "button";


        doneButton.className =
            "date-done-button";


        doneButton.textContent =
            "✓";


        doneButton.onclick =
            function () {

                closeSprintDates(this);

            };



        // build date editor
        dateEditor.appendChild(
            startDate
        );


        dateEditor.appendChild(
            dash
        );


        dateEditor.appendChild(
            endDate
        );


        dateEditor.appendChild(
            doneButton
        );



        // build date area
        sprintDates.appendChild(
            dateDisplay
        );


        sprintDates.appendChild(
            dateEditor
        );



        // sprint weight, the number gets worked out by updateSprintWeights
        const sprintWeight =
            document.createElement("section");


        sprintWeight.className =
            "sprint-weight";


        const weightLabel =
            document.createElement("span");


        weightLabel.textContent =
            "Weight";


        const weightNumber =
            document.createElement("span");


        weightNumber.className =
            "sprint-weight-number";


        weightNumber.textContent =
            "0";


        sprintWeight.appendChild(
            weightLabel
        );


        sprintWeight.appendChild(
            weightNumber
        );



        // task area
        const taskArea =
            document.createElement("section");


        taskArea.className =
            "task-area";



        // build sprint
        newSprint.appendChild(
            deleteButton
        );


        newSprint.appendChild(
            sprintName
        );


        newSprint.appendChild(
            sprintDates
        );


        newSprint.appendChild(
            sprintWeight
        );


        newSprint.appendChild(
            taskArea
        );



        // add sprint
        document
            .getElementById("sprintArea")
            .appendChild(newSprint);

    }



    // ==================== SPRINT WEIGHT ====================


    // adds up the weight of every task card inside one sprint
    function updateSprintWeight(sprintBox) {

        const weightNumber =
            sprintBox.querySelector(".sprint-weight-number");


        // the backlog doesn't have a weight
        if (!weightNumber) {

            return;

        }


        let totalWeight = 0;

        sprintBox
            .querySelectorAll(".task-card-weight")
            .forEach(function (taskWeight) {

                totalWeight += Number(taskWeight.textContent);

            });


        // only write it if it changed, writing triggers the observer below again
        if (weightNumber.textContent !== String(totalWeight)) {

            weightNumber.textContent = totalWeight;

        }

    }


    function updateAllSprintWeights() {

        document
            .querySelectorAll(".sprint-box")
            .forEach(updateSprintWeight);

    }


    // Recalculate whenever anything is added, removed or moved in the sprint area.
    // That way it stays right however tasks end up in a sprint (drag and drop included)
    // without the code that moves them needing to call anything.
    new MutationObserver(updateAllSprintWeights)
        .observe(
            document.getElementById("sprintArea"),
            { childList: true, subtree: true }
        );

    updateAllSprintWeights();



    // ==================== TASK FORM ====================


    function openTaskForm() {

        document
            .getElementById("projectOverview")
            .style.display = "none";


        document
            .getElementById("taskForm")
            .style.display = "block";

    }



    function closeTaskForm() {

        document
            .getElementById("taskForm")
            .style.display = "none";


        document
            .getElementById("projectOverview")
            .style.display = "block";

    }



    function updateTaskWeight(weight) {

        document
            .getElementById("taskWeightNumber")
            .textContent = weight;

    }

    const statusColours = {
            todo:     "#18273A",  
            inReview: "#5200A3",
            ongoing:  "#FBB13C",
            complete: "#00B800",
            overdue:  "#D62839"
    };

    function updateStatusColour(select) {

        const colour = statusColours[select.value];

        select.style.backgroundColor = colour || "#18273A";

        // dark text on the yellow so it stays readable
        select.style.color =
            select.value === "ongoing" ? "#18273A" : "#D9D9D9";

    }

    //To check if the task is past its due date and set to overdue
    function checkTaskStatus(taskStatus, deadline) {
        if(!deadline){
            return taskStatus;
        }

        if(taskStatus === "complete"){
            return taskStatus;
        }

        const today = new Date();
        today.setHours(0, 0, 0, 0);

        deadline.setHours(0, 0, 0, 0);

        if(deadline < today) {
            taskStatus = "overdue";
        }

        return taskStatus;
    }





    // ==================== SAVE TASK ====================


    function saveTask() {


        // task name
        const taskNameInput =
            document.getElementById(
                "taskNameInput"
            );


        const taskName =
            taskNameInput.value.trim();



        // priority
        const taskPriorityInput =
            document.getElementById(
                "taskPriorityInput"
            );


        const taskPriority =
            taskPriorityInput.value;



        // weight
        const taskWeightInput =
            document.getElementById(
                "taskWeightInput"
            );


        const taskWeight =
            taskWeightInput.value;

        //status
        const taskStatusInput = document.getElementById(
            "taskStatusInput"
        );

        const taskStatus = 
            checkTaskStatus(taskStatusInput.value, calendarSelectedDate);


        // task needs a name
        if (taskName === "") {

            return;

        }



        // ==================== CREATE TASK CARD ====================


        const taskCard =
            document.createElement("section");


        taskCard.className =
            "task-card";


        // ==================== STATUS UPDATE ====================
        
         // grey status circle
        const statusCircle =
            document.createElement("span");


        statusCircle.className =
            "task-status-circle";


        if(taskStatus !== "todo")
        {
            if (taskStatus === "inReview") {
               statusCircle.style.backgroundColor = "#5200A3";
            }
            else if (taskStatus === "ongoing") {
                statusCircle.style.backgroundColor = "#FBB13C";
            }
            else if (taskStatus === "complete") {
                statusCircle.style.backgroundColor = "#00B800";
                taskCard.style.backgroundColor = "#E0E0E0"
                taskCard.style.opacity = 0.5;
            }
            else if (taskStatus === "overdue") {
                statusCircle.style.backgroundColor = "#D62839";
            }
        }
        

        // task name
        const taskNameText =
            document.createElement("span");


        taskNameText.className =
            "task-card-name";


        taskNameText.textContent =
            taskName;



        // right side information
        const taskInfo =
            document.createElement("section");


        taskInfo.className =
            "task-card-info";



        // ==================== PRIORITY ====================


        if (taskPriority !== "") {


            const priorityText =
                document.createElement("span");


            priorityText.className =
                "task-priority";


            if (taskPriority === "high") {

                priorityText.textContent =
                    "⌃";

            }


            if (taskPriority === "medium") {

                priorityText.textContent =
                    "-";

            }


            if (taskPriority === "low") {

                priorityText.textContent =
                    "⌄";

            }


            taskInfo.appendChild(
                priorityText
            );

        }



        // ==================== WEIGHT ====================


        if (taskWeight !== "") {


            const weightText =
                document.createElement("span");


            weightText.className =
                "task-card-weight";


            weightText.textContent =
                taskWeight;


            taskInfo.appendChild(
                weightText
            );

        }
        
        // ==================== BUILD TASK CARD ====================


        taskCard.appendChild(
            statusCircle
        );


        taskCard.appendChild(
            taskNameText
        );


        taskCard.appendChild(
            taskInfo
        );



        // add task to backlog
        document
            .getElementById(
                "backlogTaskArea"
            )
            .appendChild(
                taskCard
            );



        // ==================== CLEAR FORM ====================


        taskNameInput.value =
            "";


        taskPriorityInput.value =
            "";


        taskWeightInput.value =
            "";

        taskStatusInput.value = 
            "";
        updateStatusColour(taskStatusInput);


        document
            .getElementById(
                "taskWeightNumber"
            )
            .textContent = "";


        const description =
            document.getElementById(
                "taskDescriptionInput"
            );


        if (description) {

            description.value =
                "";

        }


        // clear selected deadline
        calendarSelectedDate = null;

        document
            .getElementById("deadlineLabel")
            .textContent = "Deadline";

        document
            .getElementById("deadlineCalendar")
            .style.display = "none";


        // clear the tags created for this task
        resetTags();



        // return to project overview
        closeTaskForm();

    }




    // ==================== CUSTOM TAGS ====================

    // the colours a tag can be given
    const tagColours = [
        { name: "Green",  hex: "#3F9B76" },
        { name: "Teal",   hex: "#1F7F85" },
        { name: "Blue",   hex: "#3C6FC4" },
        { name: "Indigo", hex: "#5B4BB5" },
        { name: "Purple", hex: "#963A91" },
        { name: "Pink",   hex: "#C2467F" },
        { name: "Red",    hex: "#C94A4A" },
        { name: "Orange", hex: "#B8581A" },
        { name: "Gold",   hex: "#94700A" },
        { name: "Slate",  hex: "#5C6B7E" }
    ];

    // colour picked in the popup, first one by default
    let selectedTagColour = tagColours[0].hex;


    // building the colour swatches, only needs doing once
    function renderTagColours() {

        const grid = document.getElementById("tagColourGrid");

        tagColours.forEach(function (colour) {

            const swatch = document.createElement("button");

            swatch.type = "button";
            swatch.className = "tag-colour-swatch";
            swatch.style.backgroundColor = colour.hex;
            swatch.dataset.colour = colour.hex;
            swatch.title = colour.name;
            swatch.setAttribute("aria-label", colour.name);

            swatch.onclick = function () {
                selectTagColour(colour.hex);
            };

            grid.appendChild(swatch);

        });

        selectTagColour(selectedTagColour);

    }


    // highlighting the picked swatch
    function selectTagColour(hex) {

        selectedTagColour = hex;

        document
            .querySelectorAll(".tag-colour-swatch")
            .forEach(function (swatch) {

                const isSelected = swatch.dataset.colour === hex;

                swatch.classList.toggle("tag-colour-swatch-selected", isSelected);
                swatch.setAttribute("aria-pressed", isSelected);

            });

    }


    // showing/hiding the create tag popup
    function toggleTagPopup() {

        const popup = document.getElementById("tagPopup");

        if (popup.style.display === "block") {
            closeTagPopup();
        } else {
            popup.style.display = "block";
            document.getElementById("tagNameInput").focus();
        }

    }


    // hiding the popup and getting it ready for the next tag
    function closeTagPopup() {

        document
            .getElementById("tagPopup")
            .style.display = "none";

        document
            .getElementById("tagNameInput")
            .value = "";

        selectTagColour(tagColours[0].hex);

    }


    // enter adds the tag, escape closes the popup
    function handleTagNameKey(event) {

        if (event.key === "Enter") {
            addTag();
        }

        if (event.key === "Escape") {
            closeTagPopup();
        }

    }


    // putting the new tag in the tag row
    function addTag() {

        const nameInput = document.getElementById("tagNameInput");

        const tagName = nameInput.value.trim();

        // tag needs a name
        if (tagName === "") {

            nameInput.focus();

            return;

        }


        const newTag = document.createElement("button");

        newTag.type = "button";
        newTag.className = "tag-button custom-tag";
        newTag.textContent = tagName;
        newTag.style.backgroundColor = selectedTagColour;


        // goes after the existing tags, before the popup
        document
            .getElementById("tagPopup")
            .before(newTag);

        closeTagPopup();

    }


    // removing the tags that were created in the form
    function resetTags() {

        document
            .querySelectorAll(".custom-tag")
            .forEach(function (tag) {
                tag.remove();
            });

        closeTagPopup();

    }


    // clicking anywhere outside the tag area closes the popup
    document.addEventListener("click", function (event) {

        const tagArea = document.querySelector(".task-tags");

        if (!tagArea.contains(event.target)) {
            closeTagPopup();
        }

    });


    renderTagColours();


    // ==================== DEADLINE CALENDAR ====================

    const monthNames = [
        "January", "February", "March", "April", "May", "June",
        "July", "August", "September", "October", "November", "December"
    ];

    // what month/year the calendar is currently showing
    const today = new Date();
    let calendarViewYear = today.getFullYear();
    let calendarViewMonth = today.getMonth();

    // the date the user has actually picked, if any
    let calendarSelectedDate = null;


    // showing/hiding the calendar popup
    function toggleDeadlineCalendar() {

        const calendar = document.getElementById("deadlineCalendar");

        const isOpen = calendar.style.display === "block";

        if (isOpen) {
            calendar.style.display = "none";
        } else {
            renderCalendar();
            calendar.style.display = "block";
        }

    }


    // going back a month
    function calendarPrevMonth() {

        if (calendarViewMonth === 0) {
            calendarViewMonth = 11;
            calendarViewYear--;
        } else {
            calendarViewMonth--;
        }

        renderCalendar();

    }


    // going forward a month
    function calendarNextMonth() {

        if (calendarViewMonth === 11) {
            calendarViewMonth = 0;
            calendarViewYear++;
        } else {
            calendarViewMonth++;
        }

        renderCalendar();

    }


    // user picked a day in the grid
    function selectDeadlineDay(day) {

        calendarSelectedDate = new Date(calendarViewYear, calendarViewMonth, day);

        document
            .getElementById("deadlineLabel")
            .textContent =
                monthNames[calendarSelectedDate.getMonth()] + " "
                + calendarSelectedDate.getDate() + ", "
                + calendarSelectedDate.getFullYear();

        document
            .getElementById("deadlineCalendar")
            .style.display = "none";

    }


    // rebuilding the header + day grid for the current view month
    function renderCalendar() {

        document
            .getElementById("calendarMonthLabel")
            .textContent = monthNames[calendarViewMonth] + " " + calendarViewYear;


        const daysContainer = document.getElementById("calendarDays");

        daysContainer.innerHTML = "";


        const firstWeekday = new Date(calendarViewYear, calendarViewMonth, 1).getDay();
        const daysInMonth = new Date(calendarViewYear, calendarViewMonth + 1, 0).getDate();


        // empty cells before the 1st
        for (let i = 0; i < firstWeekday; i++) {

            const emptyCell = document.createElement("button");

            emptyCell.type = "button";
            emptyCell.className = "calendar-day calendar-day-empty";
            emptyCell.disabled = true;

            daysContainer.appendChild(emptyCell);

        }


        // the actual day buttons
        for (let day = 1; day <= daysInMonth; day++) {

            const dayButton = document.createElement("button");

            dayButton.type = "button";
            dayButton.className = "calendar-day";
            dayButton.textContent = day;

            const isSelected =
                calendarSelectedDate &&
                day === calendarSelectedDate.getDate() &&
                calendarViewMonth === calendarSelectedDate.getMonth() &&
                calendarViewYear === calendarSelectedDate.getFullYear();

            if (isSelected) {
                dayButton.className += " calendar-day-selected";
            }

            dayButton.onclick = function () {
                selectDeadlineDay(day);
            };

            daysContainer.appendChild(dayButton);

        }

    }


    // ==================== LOGIN NAVIGATION ====================


        function openDevPage() {

            document
                .getElementById("loginPage")
                .style.display = "none";


            document
                .getElementById("clientLanding")
                .style.display = "none";


            document
                .getElementById("devDashboard")
                .style.display = "block";

        }


        function openClientPage() {

            document
                .getElementById("loginPage")
                .style.display = "none";


            document
                .getElementById("devDashboard")
                .style.display = "none";


            document
                .getElementById("clientLanding")
                .style.display = "flex";

        }

</script>
