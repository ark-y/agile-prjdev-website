<!-- temp preview folder for project -->

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>UI Preview</title>


    <!-- css for the dev dashboard -->
    <link
            rel="stylesheet"
            href="src/pages/DevLanding/DevLanding.css"
    >


    <!-- css for the create project popup -->
    <link
            rel="stylesheet"
            href="src/components/CreateProjectForm/CreateProjectForm.css"
    >


    <!-- css for the project cards -->
    <link
            rel="stylesheet"
            href="src/components/ProjectCard/ProjectCard.css"
    >


    <!-- css for the project overview -->
    <link
            rel="stylesheet"
            href="src/pages/ProjectOverview/ProjectOverview.css"
    >


    <!-- css for the task form -->
    <link
            rel="stylesheet"
            href="src/components/CreateTaskForm/CreateTaskForm.css"
    >


    <!-- css for the login page -->
    <link
            rel="stylesheet"
            href="src/pages/Login/Login.css"
    >


    <!-- css for the client landing page -->
    <link
            rel="stylesheet"
            href="src/pages/ClientLanding/ClientLanding.css"
    >

</head>


<body>


<!-- ==================== LOGIN PAGE ==================== -->

<main
        class="login-page"
        id="loginPage"
>

    <h1>Login Page</h1>

    <div class="button-group">
        <button
                class="credential-button dev-button"
                onclick="openDevPage()">
            Dev page
        </button>

        <button
                class="credential-button client-button"
                onclick="openClientPage()">
            Client page
        </button>
    </div>

    <button class="login-button">
        <h2>LOGIN</h2>
    </button>

</main>


<!-- ==================== CLIENT LANDING ==================== -->

<main
        class="client-page"
        id="clientLanding"
        style="display: none;"
>

    <header class="client-dashboard-header">
        <h1>PROJECT 1</h1>
        <span class="percentage" id="header-percentage">67%</span>
    </header>

    <section class="dashboard-content">

        <section class="progress-section" aria-label="Overall progress">
            <figure class="progress-donut-container">
                <span class="progress-donut" id="progress-donut"></span>
            </figure>
        </section>

        <section class="right-panel">

            <article class="current-tasks">
                <h2>Current Tasks</h2>
                <ul class="current-tasks-list">
                    <li class="task-item">Task 1</li>
                    <li class="task-item">Task 2</li>
                    <li class="task-item">Long task 3</li>
                    <li class="task-item">Tasks all around</li>
                </ul>
            </article>

            <article class="client-sprint-box">
                <h3>Sprint 4</h3>
                <span class="percentage">67%</span>
            </article>

        </section>

    </section>

</main>


<!-- ==================== DEV DASHBOARD ==================== -->

<main
        class="dev-page"
        id="devDashboard"
        style="display: none;"
>

    <!-- top blue bit -->
    <header class="dashboard-header">

        <h1>X'S DASHBOARD</h1>


        <!-- icons on the right -->
        <section class="dashboard-icons">

            <!-- messages -->
            <button class="message-button">
                📥
            </button>

            <!-- settings -->
            <button class="settings-button">
                ⚙
            </button>

        </section>

    </header>


    <!-- where all the projects go -->
    <section class="projects-section">

        <!-- making a new project -->
        <button
                class="add-project"
                onclick="openProjectPopup()"
        >
            +
        </button>


        <!-- sample project just for testing -->
        <button
                class="project-card"
                onclick="openSampleProject()"
        >

            <span class="project-name">
                Sample Project
            </span>

        </button>

    </section>


    <!-- create project popup -->
    <section
            class="popup-background"
            id="projectPopup"
    >

        <!-- actual popup -->
        <form class="create-project-popup">

            <h2>Create Project</h2>


            <!-- getting the project name -->
            <label for="projectName">
                Project Name
            </label>

            <input
                    type="text"
                    id="projectName"
                    placeholder="Enter project name"
            >


            <!-- buttons at the bottom -->
            <section class="popup-buttons">

                <!-- closing the popup -->
                <button
                        type="button"
                        class="cancel-button"
                        onclick="closeProjectPopup()"
                >
                    Cancel
                </button>


                <!-- making the project -->
                <button
                        type="button"
                        class="create-button"
                >
                    Create Project
                </button>

            </section>

        </form>

    </section>

</main>



<!-- ==================== PROJECT OVERVIEW ==================== -->

<main
        class="project-page"
        id="projectOverview"
        style="display: none;"
>

    <!-- same header as dev landing -->
    <header class="project-header">

        <!-- project name -->
        <h1>SAMPLE PROJECT</h1>


        <!-- icons on the right -->
        <section class="project-header-icons">

            <!-- messages -->
            <button class="message-button">
                📥
            </button>

            <!-- settings -->
            <button class="settings-button">
                ⚙
            </button>

        </section>

    </header>


    <!-- everything under the header -->
    <section class="project-body">


        <!-- backlog and sprints -->
        <section
                class="sprint-area"
                id="sprintArea"
        >

            <!-- backlog is always first -->
            <section class="sprint-box">

                <h2>BACKLOG</h2>

                <section class="task-area">

                </section>

            </section>


            <!-- sample sprint -->
            <section class="sprint-box">

                <!-- delete sprint -->
                <button
                        type="button"
                        class="delete-sprint-button"
                        onclick="deleteSprint(this)"
                        aria-label="Delete sprint"
                >
                    ×
                </button>


                <!-- sprint name -->
                <input
                        class="sprint-name-input"
                        type="text"
                        value="SPRINT 1"
                >


                <!-- sprint dates -->
                <section class="sprint-dates">

                    <!-- compact date -->
                    <button
                            type="button"
                            class="sprint-date-display"
                            onclick="openSprintDates(this)"
                    >
                        11/09 - 25/09
                    </button>


                    <!-- date editor -->
                    <section
                            class="sprint-date-editor"
                            style="display: none;"
                    >

                        <input
                                type="date"
                                class="sprint-start-date"
                                value="2026-09-11"
                                onchange="updateSprintDates(this)"
                        >


                        <span>
                            -
                        </span>


                        <input
                                type="date"
                                class="sprint-end-date"
                                value="2026-09-25"
                                min="2026-09-11"
                                onchange="updateSprintDates(this)"
                        >


                        <button
                                type="button"
                                class="date-done-button"
                                onclick="closeSprintDates(this)"
                        >
                            ✓
                        </button>

                    </section>

                </section>


                <section class="task-area">

                </section>

            </section>

        </section>


        <!-- fade before the grey boxes -->
        <section class="sidebar-fade"></section>


        <!-- stuff on the far right -->
        <aside class="project-sidebar">


            <!-- progress box -->
            <section class="progress-box">

                <h2>PROGRESS</h2>


                <!-- progress bar -->
                <section class="progress-row">

                    <section class="progress-bar">

                        <span class="progress-fill"></span>

                    </section>

                    <span class="progress-number">
                        46%
                    </span>

                </section>


                <!-- info about the project -->
                <section class="progress-info">

                    <p>Team list</p>
                    <p>Project timeline</p>
                    <p>Project due date</p>
                    <p>Client</p>

                </section>

            </section>


            <!-- buttons under progress -->
            <section class="sidebar-buttons">

                <!-- adding a task -->
                <button
                        class="sidebar-button"
                        onclick="openTaskForm()"
                >

                    <span>ADD</span>

                    <span class="sidebar-plus">
                        +
                    </span>

                    <span>TASK</span>

                </button>


                <!-- adding a sprint -->
                <button
                        class="sidebar-button"
                        onclick="addSprint()"
                >

                    <span>ADD</span>

                    <span class="sidebar-plus">
                        +
                    </span>

                    <span>SPRINT</span>

                </button>

            </section>

        </aside>

    </section>


    <!-- going back to all the projects -->
    <button
            type="button"
            class="back-projects-button"
            onclick="backToProjects()"
    >
        ← Back to Projects
    </button>

</main>



<!-- ==================== TASK FORM ==================== -->

<main
        class="task-form-page"
        id="taskForm"
        style="display: none;"
>

    <header class="task-form-header">

        <input
                class="task-name-input"
                type="text"
                placeholder="Task name"
        >


        <span
                class="task-weight-number"
                id="taskWeightNumber"
        >
        </span>

    </header>


    <section class="task-form-body">


        <section class="task-form-row">

            <section class="task-tags">

                <button
                        type="button"
                        class="add-tag-button"
                >
                    + tag
                </button>


                <button
                        type="button"
                        class="tag-button tag-green"
                >
                    Tag 1
                </button>


                <button
                        type="button"
                        class="tag-button tag-purple"
                >
                    Long Tag 2
                </button>

            </section>


            <section class="weight-wrapper">

                <select
                        class="weight-select"
                        onchange="updateTaskWeight(this.value)"
                >

                    <option value="">Weight</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                    <option value="9">9</option>
                    <option value="10">10</option>

                </select>


                <span class="select-arrow">
                    ▼
                </span>

            </section>

        </section>


        <section class="task-form-row">


            <button
                    type="button"
                    class="fake-dropdown deadline-dropdown"
            >

                <span>Deadline</span>

                <span class="dropdown-arrow">
                    ▼
                </span>

            </button>


            <button
                    type="button"
                    class="fake-dropdown assignee-dropdown"
            >

                <span>Assignee</span>

                <span class="dropdown-arrow">
                    ▼
                </span>

            </button>

        </section>


        <textarea
                class="task-description"
                placeholder="Description"
        ></textarea>


        <section class="task-form-buttons">

            <button
                    type="button"
                    class="task-cancel-button"
                    onclick="closeTaskForm()"
            >
                Cancel
            </button>


            <button
                    type="button"
                    class="task-save-button"
            >
                Save Task
            </button>

        </section>

    </section>

</main>



<!-- ==================== TEMPORARY JS ==================== -->

<script>


    // keeping track of how many sprints have been created
    let sprintCount = 1;



    // ==================== PROJECT POPUP ====================


    function openProjectPopup() {

        document
            .getElementById("projectPopup")
            .style.display = "flex";

    }


    function closeProjectPopup() {

        document
            .getElementById("projectPopup")
            .style.display = "none";

    }



    // ==================== PROJECT NAVIGATION ====================


    function openSampleProject() {

        document
            .getElementById("devDashboard")
            .style.display = "none";


        document
            .getElementById("taskForm")
            .style.display = "none";


        document
            .getElementById("projectOverview")
            .style.display = "block";

    }


    function backToProjects() {

        document
            .getElementById("projectOverview")
            .style.display = "none";


        document
            .getElementById("taskForm")
            .style.display = "none";


        document
            .getElementById("devDashboard")
            .style.display = "block";

    }



    // ==================== SPRINT DATES ====================


    // changing YYYY-MM-DD into DD/MM
    function formatSprintDate(date) {

        if (!date) {

            return "--/--";

        }


        const parts = date.split("-");

        const month = parts[1];

        const day = parts[2];


        return day + "/" + month;

    }



    // opening the date editor for the selected sprint
    function openSprintDates(button) {

        const sprintBox =
            button.closest(".sprint-box");


        const dateDisplay =
            sprintBox.querySelector(".sprint-date-display");


        const dateEditor =
            sprintBox.querySelector(".sprint-date-editor");


        dateDisplay.style.display = "none";

        dateEditor.style.display = "flex";

    }



    // updating date rules
    function updateSprintDates(input) {

        const sprintBox =
            input.closest(".sprint-box");


        const startDateInput =
            sprintBox.querySelector(".sprint-start-date");


        const endDateInput =
            sprintBox.querySelector(".sprint-end-date");


        const startDate =
            startDateInput.value;


        const endDate =
            endDateInput.value;


        // end date cannot be before start date
        endDateInput.min = startDate;


        // clearing end date if it becomes invalid
        if (
            startDate &&
            endDate &&
            endDate < startDate
        ) {

            endDateInput.value = "";

        }

    }



    // closing date editor
    function closeSprintDates(button) {

        const sprintBox =
            button.closest(".sprint-box");


        const startDateInput =
            sprintBox.querySelector(".sprint-start-date");


        const endDateInput =
            sprintBox.querySelector(".sprint-end-date");


        const dateDisplay =
            sprintBox.querySelector(".sprint-date-display");


        const dateEditor =
            sprintBox.querySelector(".sprint-date-editor");


        const startDate =
            startDateInput.value;


        const endDate =
            endDateInput.value;


        dateDisplay.textContent =
            formatSprintDate(startDate)
            + " - "
            + formatSprintDate(endDate);


        dateEditor.style.display =
            "none";


        dateDisplay.style.display =
            "inline-block";

    }



    // ==================== DELETE SPRINT ====================


    function deleteSprint(button) {

        // finding the sprint this button belongs to
        const sprintBox =
            button.closest(".sprint-box");


        // getting sprint name
        const sprintNameInput =
            sprintBox.querySelector(".sprint-name-input");


        const sprintName =
            sprintNameInput.value;


        // asking before deleting
        const confirmed =
            confirm(
                "Are you sure you want to delete "
                + sprintName
                + "?"
            );


        if (confirmed) {

            sprintBox.remove();

        }

    }



    // ==================== ADD SPRINT ====================


    function addSprint() {

        // increasing sprint number
        sprintCount++;



        // -------------------- sprint box --------------------

        const newSprint =
            document.createElement("section");

        newSprint.className =
            "sprint-box";



        // -------------------- delete button --------------------

        const deleteButton =
            document.createElement("button");


        deleteButton.type =
            "button";


        deleteButton.className =
            "delete-sprint-button";


        deleteButton.textContent =
            "×";


        deleteButton.setAttribute(
            "aria-label",
            "Delete sprint"
        );


        deleteButton.onclick = function () {

            deleteSprint(this);

        };



        // -------------------- sprint name --------------------

        const sprintName =
            document.createElement("input");


        sprintName.className =
            "sprint-name-input";


        sprintName.type =
            "text";


        sprintName.value =
            "SPRINT " + sprintCount;



        // -------------------- date area --------------------

        const sprintDates =
            document.createElement("section");


        sprintDates.className =
            "sprint-dates";



        // -------------------- compact date display --------------------

        const dateDisplay =
            document.createElement("button");


        dateDisplay.type =
            "button";


        dateDisplay.className =
            "sprint-date-display";


        dateDisplay.textContent =
            "--/-- - --/--";


        dateDisplay.onclick = function () {

            openSprintDates(this);

        };



        // -------------------- date editor --------------------

        const dateEditor =
            document.createElement("section");


        dateEditor.className =
            "sprint-date-editor";


        dateEditor.style.display =
            "none";



        // -------------------- start date --------------------

        const startDate =
            document.createElement("input");


        startDate.type =
            "date";


        startDate.className =
            "sprint-start-date";


        startDate.onchange = function () {

            updateSprintDates(this);

        };



        // -------------------- dash --------------------

        const dash =
            document.createElement("span");


        dash.textContent =
            "-";



        // -------------------- end date --------------------

        const endDate =
            document.createElement("input");


        endDate.type =
            "date";


        endDate.className =
            "sprint-end-date";


        endDate.onchange = function () {

            updateSprintDates(this);

        };



        // -------------------- done button --------------------

        const doneButton =
            document.createElement("button");


        doneButton.type =
            "button";


        doneButton.className =
            "date-done-button";


        doneButton.textContent =
            "✓";


        doneButton.onclick = function () {

            closeSprintDates(this);

        };



        // putting date controls together
        dateEditor.appendChild(
            startDate
        );


        dateEditor.appendChild(
            dash
        );


        dateEditor.appendChild(
            endDate
        );


        dateEditor.appendChild(
            doneButton
        );



        // putting date area together
        sprintDates.appendChild(
            dateDisplay
        );


        sprintDates.appendChild(
            dateEditor
        );



        // -------------------- task area --------------------

        const taskArea =
            document.createElement("section");


        taskArea.className =
            "task-area";



        // -------------------- building sprint --------------------

        newSprint.appendChild(
            deleteButton
        );


        newSprint.appendChild(
            sprintName
        );


        newSprint.appendChild(
            sprintDates
        );


        newSprint.appendChild(
            taskArea
        );



        // -------------------- putting sprint on page --------------------

        document
            .getElementById("sprintArea")
            .appendChild(newSprint);

    }



    // ==================== TASK FORM ====================


    function openTaskForm() {

        document
            .getElementById("projectOverview")
            .style.display = "none";


        document
            .getElementById("taskForm")
            .style.display = "block";

    }


    function closeTaskForm() {

        document
            .getElementById("taskForm")
            .style.display = "none";


        document
            .getElementById("projectOverview")
            .style.display = "block";

    }


    function updateTaskWeight(weight) {

        document
            .getElementById("taskWeightNumber")
            .textContent = weight;

    }



    // ==================== LOGIN NAVIGATION ====================


    function openDevPage() {

        document
            .getElementById("loginPage")
            .style.display = "none";


        document
            .getElementById("clientLanding")
            .style.display = "none";


        document
            .getElementById("devDashboard")
            .style.display = "block";

    }


    function openClientPage() {

        document
            .getElementById("loginPage")
            .style.display = "none";


        document
            .getElementById("devDashboard")
            .style.display = "none";


        document
            .getElementById("clientLanding")
            .style.display = "flex";

    }


</script>


<!-- progressbar.js for the client landing donut chart -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/progressbar.js/1.1.0/progressbar.min.js"></script>
<script>

    var donut = new ProgressBar.Circle('#progress-donut', {
        color: '#6FD361',
        trailColor: '#18273A',
        strokeWidth: 15,
        trailWidth: 15,
        fill: null,
        duration: 1200,
        easing: 'easeOut',
        svgStyle: {
            display: 'block',
            width: '100%',
            height: '100%'
        }
    });

    donut.set(0.67); // 67%

</script>

</body>

</html>
